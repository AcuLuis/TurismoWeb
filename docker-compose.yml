# Base de datos para desarrollo local (SQL Server 2022 Developer Edition, gratuita para desarrollo).
# Uso:  docker compose up -d
# La contraseña se toma de .env (copiar .env.example). El valor por defecto es SOLO para desarrollo local.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: turismogo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-TurismoGo_Dev_2026!}"
    ports:
      - "${MSSQL_PORT:-14333}:1433"
    volumes:
      - turismogo-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  turismogo-sqldata:
